name = "mailfree"
main = "src/server.js"
compatibility_date = "2024-01-01"
keep_vars = true

routes = [
  { pattern = "mail.clinamia.com", custom_domain = true }
]

[[d1_databases]]
binding = "TEMP_MAIL_DB"
database_name = "freemail"
database_id = "721d2b88-61e8-49de-81d9-a4ad5b5cd8f7"

# 非敏感变量；ADMIN_PASSWORD / JWT_TOKEN 通过 wrangler secret 设置
[vars]
ADMIN_NAME = "admin"
SESSION_EXPIRE_DAYS = "365"
MAIL_DOMAIN = "clinamia.com"

[assets]
directory = "public"
binding = "ASSETS"
